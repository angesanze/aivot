# GitOps: ogni push sul branch `production` ridistribuisce AIVOT su un
# progetto Google Cloud GIÀ ESISTENTE (la prima creazione del progetto si fa
# col bottone "Open in Cloud Shell", vedi README).
#
# Segreti/variabili da configurare nel repo (Settings → Secrets and variables):
#   secret  GCP_CREDENTIALS    JSON di un service account con i ruoli di deploy
#   secret  BREVO_API_KEY      (facoltativo) chiave Brevo
#   var     GCP_PROJECT_ID     id del progetto già esistente
#   var     GCP_REGION         es. europe-west1
#   var     TF_STATE_BUCKET    bucket GCS dove tenere lo stato Terraform
#   var     BREVO_SENDER_EMAIL (facoltativo)
#   var     GOOGLE_CLIENT_ID   (facoltativo)
name: Deploy su Google Cloud

on:
  push:
    branches: [production]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installa la Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        env:
          # deploy.sh gira non interattivo: tutto arriva dall'ambiente.
          CREATE_PROJECT: "false"
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          # Stato Terraform su GCS: deploy.sh scrive backend.tf e fa init.
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          # La Firebase CLI e Terraform usano queste credenziali ADC.
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: bash infra/deploy.sh
