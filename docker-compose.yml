services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: solverstore
      POSTGRES_USER: solverstore
      POSTGRES_PASSWORD: solverstore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solverstore"]
      interval: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: solverstore
      POSTGRES_USER: solverstore
      POSTGRES_PASSWORD: solverstore
      # Tutto il resto si configura nel file .env (vedi .env.example):
      # niente segreti in questo file.
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-AIVOT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-aivot-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@aivot.local}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed &&
             python manage.py collectstatic --no-input &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 120"

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
